org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Sniddle's version: MAJOR.MINOR. CI adds the patch number: each release from
# main is the next unused v<MAJOR.MINOR>.<n> tag (v0.1.0, v0.1.1, ...). Change
# this line to start a new series (0.2 -> v0.2.0, 1.0 when it's finished).
appVersion=0.1
