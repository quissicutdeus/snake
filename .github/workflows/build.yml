name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Linters (ktlint, detekt, Android Lint, dead code)
        run: ./gradlew lintAll --console=plain

      - name: Game tests
        run: ./gradlew :game:test --console=plain

      - name: App screenshot tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Upload reports (tests, lint, detekt)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            game/build/reports
            app/build/reports

      - name: Upload APK (optimized, install this one)
        uses: actions/upload-artifact@v4
        with:
          name: snake-arena-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-arena-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots
