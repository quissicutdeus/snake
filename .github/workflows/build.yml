name: Build

# Every push and pull request: lint, test and build. On main, if all of that
# passes, a GitHub release "v0.0.<build number>" is published with
# snake-arena.apk attached, so the newest APK is always at
#   releases/latest/download/snake-arena.apk
# "Run workflow" in the Actions tab publishes one from any branch.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Still a beta: 0.0.<build number>. Change the "0.0" to 0.1 / 1.0 when it's
  # ready. Android only compares the build number (versionCode), which always
  # goes up, so every release still installs over the previous one.
  VERSION_NAME: 0.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Linters (ktlint, detekt, Android Lint, dead code)
        run: ./gradlew lintAll --console=plain

      - name: Game tests
        run: ./gradlew :game:test --console=plain

      - name: App screenshot tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build APKs (version ${{ env.VERSION_NAME }})
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
          -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION_NAME }}

      - name: Upload reports (tests, lint, detekt)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            game/build/reports
            app/build/reports

      - name: Upload APK (optimized, install this one)
        uses: actions/upload-artifact@v4
        with:
          name: snake-arena-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-arena-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snake-arena-apk

      - name: Create release v${{ env.VERSION_NAME }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk snake-arena.apk
          cat > notes.md <<NOTES
          Snake Arena $VERSION_NAME (beta) for Android 16+ (Pixel 6 and newer).

          **Install:** open this page on the phone, tap **snake-arena.apk**, then open
          the download and allow installing apps from that source when Android asks.
          It installs over any earlier version and keeps the high scores.

          Built from $GITHUB_SHA.
          NOTES
          gh release create "v$VERSION_NAME" snake-arena.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Snake Arena $VERSION_NAME (beta)" \
            --notes-file notes.md \
            --latest
