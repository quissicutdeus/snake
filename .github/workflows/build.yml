name: Build

# Every push and pull request: lint, test and build. On main, if all of that
# passes, a GitHub release "v<MAJOR.MINOR>.<patch>" is published with
# sniddle.apk attached, so the newest APK is always at
#   releases/latest/download/sniddle.apk
# "Run workflow" in the Actions tab publishes one from any branch.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Semver: MAJOR.MINOR is appVersion in gradle.properties; the patch is the next
# unused number among that series' tags. Android itself only compares the build
# number (versionCode = run number), which always goes up, so every release
# installs over the previous one.

# Runs on main go one at a time, so two pushes can't pick the same patch
# number. On other branches a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Lint and build run side by side on separate runners (lint alone takes
  # about as long as testing and building), so a push waits for the slower
  # of the two, not both. Both reuse the same Gradle cache.
  lint:
    name: Kotlin and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # v6 caches through gradle-actions-caching, a proprietary component:
      # using it accepts https://gradle.com/legal/terms-of-use/ (agreed
      # 2026-11-10). cache-provider: basic switches to the open-source cache.
      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: &sdk |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Linters (ktlint, detekt, Android Lint, dead code)
        run: ./gradlew lintAll --console=plain

      - name: Upload reports (lint, detekt)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            game/build/reports
            app/build/reports

  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Same Gradle cache (and terms) as the lint job.
      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: *sdk

      - name: Pick the release version (appVersion + next unused patch)
        id: version
        run: |
          base=$(sed -n 's/^appVersion=//p' gradle.properties)
          if ! printf '%s\n' "$base" | grep -Eqx '[0-9]+\.[0-9]+'; then
            echo "::error file=gradle.properties::appVersion must be MAJOR.MINOR, found '$base'"
            exit 1
          fi
          base_re=$(printf '%s' "$base" | sed 's/\./\\./g')
          # Tags on GitHub, not in this shallow checkout. Fails the step if GitHub can't be reached.
          tags=$(git ls-remote --tags --refs origin)
          last=$(printf '%s\n' "$tags" | sed -n "s#.*refs/tags/v$base_re\.\([0-9][0-9]*\)\$#\1#p" | sort -n | tail -n 1)
          version="$base.$(( ${last:--1} + 1 ))"
          echo "Version $version (last v$base.* tag: ${last:-none})"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"

      # One Gradle run, so the game tests, the Robolectric screenshot tests and
      # the release build (R8) can overlap. Only the release APK is built: it's
      # the one that gets installed.
      - name: Tests and release APK (version ${{ env.VERSION_NAME }})
        run: >-
          ./gradlew :game:test :app:testDebugUnitTest :app:assembleRelease --console=plain
          -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION_NAME }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            game/build/reports
            app/build/reports

      - name: Upload APK (optimized, install this one)
        uses: actions/upload-artifact@v7
        with:
          name: sniddle-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots

  # Everything that isn't Kotlin, in pinned Docker images (the same versions
  # can be run locally: actionlint, scripts/lint-shell.sh, markdownlint-cli2).
  lint-repo:
    name: Workflow, shell and Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: actionlint (workflows, including shellcheck on run steps)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: shellcheck + shfmt (shell scripts)
        env:
          SHELLCHECK: docker run --rm -v ${{ github.workspace }}:/mnt -w /mnt koalaman/shellcheck:v0.11.0
          SHFMT: docker run --rm -v ${{ github.workspace }}:/mnt -w /mnt mvdan/shfmt:v3.14.1
        run: scripts/lint-shell.sh

      - name: markdownlint (config in .markdownlint-cli2.yaml)
        uses: docker://davidanson/markdownlint-cli2:v0.23.2

  release:
    name: Publish GitHub release
    needs: [lint, build, lint-repo]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION_NAME: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sniddle-apk

      - name: Create release v${{ env.VERSION_NAME }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk sniddle.apk
          # 0.x releases are betas; from 1.0.0 on they're just releases.
          label=""
          case $VERSION_NAME in 0.*) label=" (beta)" ;; esac
          cat > notes.md <<NOTES
          Sniddle $VERSION_NAME$label for Android 11 and newer.

          **Install:** open this page on the phone, tap **sniddle.apk**, then open
          the download and allow installing apps from that source when Android asks.
          It installs over any earlier version and keeps the high scores.

          Built from $GITHUB_SHA.
          NOTES
          gh release create "v$VERSION_NAME" sniddle.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sniddle $VERSION_NAME$label" \
            --notes-file notes.md \
            --latest
